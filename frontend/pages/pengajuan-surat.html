<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ajukan Surat | Desa Cempaka</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-dark: #081b2a;
        --bg-mid: #112d3f;
        --bg-soft: #153f55;
        --glass: rgba(255, 255, 255, 0.10);
        --glass-border: rgba(255, 255, 255, 0.18);
        --text: #edf8ff;
        --text-soft: #b7d7e8;
        --primary: #67e7c8;
        --secondary: #7ec8ff;
        --accent: #ffe79a;
        --shadow: 0 25px 60px rgba(10, 20, 30, 0.38);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: linear-gradient(135deg, var(--bg-dark), var(--bg-mid) 50%, var(--bg-soft));
        color: var(--text);
      }

      .container {
        width: min(800px, calc(100% - 32px));
        margin: 0 auto;
        padding: 2rem 0;
      }

      .back-button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 1.5rem;
        padding: 0.6rem 1rem;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 8px;
        color: var(--text);
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .back-button:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .form-card {
        background: var(--glass);
        border: 1px solid var(--glass-border);
        backdrop-filter: blur(18px);
        border-radius: 18px;
        padding: 2rem;
      }

      .form-header {
        margin-bottom: 2rem;
        text-align: center;
      }

      .form-header h1 {
        margin: 0 0 0.5rem;
        font-size: 1.8rem;
      }

      .form-header p {
        margin: 0;
        color: var(--text-soft);
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        font-size: 0.9rem;
      }

      input[type="text"],
      input[type="email"],
      input[type="tel"],
      input[type="date"],
      select,
      textarea {
        width: 100%;
        padding: 0.85rem 1rem;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        font-size: 0.95rem;
        transition: all 0.25s ease;
      }

      input[type="text"]:focus,
      input[type="email"]:focus,
      input[type="tel"]:focus,
      input[type="date"]:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: rgba(103, 231, 200, 0.5);
        background: rgba(255, 255, 255, 0.12);
        box-shadow: 0 0 0 3px rgba(103, 231, 200, 0.08);
      }

      textarea {
        resize: vertical;
        min-height: 100px;
        font-family: inherit;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.2rem;
      }

      .form-grid.full {
        grid-template-columns: 1fr;
      }

      .file-upload {
        padding: 2rem;
        border: 2px dashed rgba(103, 231, 200, 0.3);
        border-radius: 12px;
        text-align: center;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .file-upload:hover {
        border-color: rgba(103, 231, 200, 0.6);
        background: rgba(103, 231, 200, 0.08);
      }

      .file-upload input[type="file"] {
        display: none;
      }

      .file-upload-icon {
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }

      .file-upload-text p {
        margin: 0.25rem 0;
        color: var(--text-soft);
      }

      .file-list {
        margin-top: 1rem;
      }

      .file-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0.8rem;
        background: rgba(103, 231, 200, 0.1);
        border-radius: 8px;
        margin-bottom: 0.5rem;
      }

      .file-item .remove {
        margin-left: auto;
        color: var(--secondary);
        cursor: pointer;
      }

      .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 2rem;
      }

      .btn {
        flex: 1;
        padding: 1rem;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: #062a35;
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 18px 30px rgba(103, 231, 200, 0.25);
      }

      .btn-secondary {
        background: rgba(255, 255, 255, 0.08);
        color: var(--text);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }

      .btn-secondary:hover {
        background: rgba(255, 255, 255, 0.12);
      }

      .alert {
        padding: 1rem;
        border-radius: 10px;
        margin-bottom: 1.5rem;
        display: none;
      }

      .alert.show {
        display: block;
      }

      .alert.info {
        background: rgba(126, 200, 255, 0.12);
        border: 1px solid rgba(126, 200, 255, 0.25);
        color: #a8d8ff;
      }

      @media (max-width: 640px) {
        .form-grid {
          grid-template-columns: 1fr;
        }

        .form-actions {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button class="back-button" onclick="history.back()">← Kembali</button>

      <div class="form-card">
        <div class="form-header">
          <h1>Ajukan Surat</h1>
          <p>Lengkapi formulir di bawah untuk mengajukan surat keterangan</p>
        </div>

        <div class="alert info show">
          ℹ️ Semua field dengan tanda (*) harus diisi
        </div>

        <form id="pengajuanForm" onsubmit="handleSubmit(event)">
          <div class="form-group">
            <label for="jenisSurat">Jenis Surat *</label>
            <select id="jenisSurat" required>
              <option value="">-- Pilih Jenis Surat --</option>
              <option value="domisili">Surat Keterangan Domisili</option>
              <option value="usaha">Surat Keterangan Usaha</option>
              <option value="ktp">Surat Pengantar KTP</option>
              <option value="kk">Surat Pengantar KK</option>
              <option value="kelahiran">Surat Keterangan Kelahiran</option>
              <option value="pindah">Surat Keterangan Pindah</option>
            </select>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="nik">NIK *</label>
              <input type="text" id="nik" value="3201031990120001" readonly />
            </div>
            <div class="form-group">
              <label for="nama">Nama Lengkap *</label>
              <input type="text" id="nama" value="Budi Santoso" required />
            </div>
          </div>

          <div class="form-grid">
            <div class="form-group">
              <label for="email">Email *</label>
              <input type="email" id="email" value="budi@email.com" required />
            </div>
            <div class="form-group">
              <label for="telepon">Telepon *</label>
              <input type="tel" id="telepon" value="0812-3456-7890" required />
            </div>
          </div>

          <div class="form-group">
            <label for="alamat">Alamat Lengkap *</label>
            <textarea id="alamat" required>Jl. Raya Desa Cempaka No. 12, RT 03, RW 05</textarea>
          </div>

          <div class="form-group">
            <label for="tujuan">Tujuan Penggunaan Surat *</label>
            <input type="text" id="tujuan" placeholder="Misal: Keperluan Usaha, Pendaftaran, dll" required />
          </div>

          <div class="form-group">
            <label>Upload Dokumen Pendukung</label>
            <div class="file-upload" onclick="document.getElementById('dokumen').click()">
              <div class="file-upload-icon">📎</div>
              <div class="file-upload-text">
                <p>Klik atau seret file ke sini</p>
                <p>Maksimal 5MB (PDF, JPG, PNG)</p>
              </div>
              <input type="file" id="dokumen" accept=".pdf,.jpg,.png" />
            </div>
            <div class="file-list" id="fileList"></div>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-secondary" onclick="history.back()">Batal</button>
            <button type="submit" class="btn btn-primary">Ajukan Surat</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      document.getElementById('dokumen').addEventListener('change', function(e) {
        const fileList = document.getElementById('fileList');
        fileList.innerHTML = '';
        for (const file of e.target.files) {
          const fileItem = document.createElement('div');
          fileItem.className = 'file-item';
          fileItem.innerHTML = `📄 ${file.name} <span class="remove">✕</span>`;
          fileList.appendChild(fileItem);
        }
      });

      function handleSubmit(e) {
        e.preventDefault();
        alert('✅ Pengajuan surat berhasil! Nomor registrasi: #2026-00' + Math.floor(Math.random() * 1000));
        // In real app, send to server here
      }
    </script>
  </body>
</html>
